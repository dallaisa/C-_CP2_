name: publish-images

# Publica as imagens web e worker somente depois que build e testes passam.
# Cada imagem recebe como tag o SHA completo do commit; nao ha tag "latest".
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./sources/ExpenseHub.slnx

      - name: Build
        run: dotnet build ./sources/ExpenseHub.slnx --no-restore

      - name: Test
        run: dotnet test ./sources/ExpenseHub.slnx --no-build

  publish:
    name: Publish ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: expensehub-api
            dockerfile: sources/ExpenseHub.Api/Dockerfile
          - image: expensehub-worker
            dockerfile: sources/ExpenseHub.Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Compute image name
        id: name
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.name.outputs.ref }}:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
